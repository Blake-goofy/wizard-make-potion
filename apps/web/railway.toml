[build]
watchPatterns = ["/apps/web/**", "/packages/shared/**", "/package.json", "/package-lock.json", "/tsconfig.base.json"]
buildCommand = "npm run build -w @potion/web"

[deploy]
startCommand = "npm run preview -w @potion/web"
healthcheckPath = "/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
