[build]
watchPatterns = ["/apps/api/**", "/packages/**", "/package.json", "/package-lock.json", "/tsconfig.base.json"]
buildCommand = "npm run build -w @potion/api"

[deploy]
startCommand = "npm run start -w @potion/api"
healthcheckPath = "/api/health"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
